name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build Release (${{ matrix.platform }})
    needs: ci-gate
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: release-${{ matrix.platform }}

      - name: Setup Rust (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: startsWith(matrix.platform, 'macos')

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="shruti-${VERSION}-${{ matrix.platform }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/shruti dist/
          cp LICENSE README.md dist/
          tar czf "$ARCHIVE" -C dist .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256" 2>/dev/null || \
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            shruti-*.tar.gz
            shruti-*.tar.gz.sha256
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG_COUNT=$(git tag --sort=-version:refname | wc -l)
          if [ "$TAG_COUNT" -ge 2 ]; then
            PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
            CHANGELOG=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          else
            CHANGELOG=$(git log --oneline --no-decorate)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Shruti ${{ steps.version.outputs.version }}
          body: |
            ## Shruti ${{ steps.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            | Platform | Archive |
            |----------|---------|
            | Linux x86_64 | `shruti-${{ steps.version.outputs.version }}-linux-amd64.tar.gz` |
            | Linux arm64 | `shruti-${{ steps.version.outputs.version }}-linux-arm64.tar.gz` |
            | macOS arm64 | `shruti-${{ steps.version.outputs.version }}-macos-arm64.tar.gz` |

            ### Verification
            Each archive includes a `.sha256` checksum file.
          files: |
            release-artifacts/release-linux-amd64/*
            release-artifacts/release-linux-arm64/*
            release-artifacts/release-macos-arm64/*
          prerelease: true

name: Release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-release:
    name: Build Release (${{ matrix.platform }})
    needs: ci-gate
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            binary: shruti
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-latest
            binary: shruti
            archive: tar.gz
          - platform: windows
            runner: windows-latest
            binary: shruti.exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: release-${{ matrix.platform }}
          install-system-deps: ${{ matrix.platform == 'linux' }}

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo build --release --workspace

      - name: Package release (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR="shruti-${VERSION}-${{ matrix.platform }}"
          mkdir -p "${RELEASE_DIR}"

          cp target/release/${{ matrix.binary }} "${RELEASE_DIR}/"
          cp LICENSE README.md "${RELEASE_DIR}/"

          tar czf "${RELEASE_DIR}.tar.gz" "${RELEASE_DIR}"
          sha256sum "${RELEASE_DIR}.tar.gz" > "${RELEASE_DIR}.tar.gz.sha256" 2>/dev/null || \
            shasum -a 256 "${RELEASE_DIR}.tar.gz" > "${RELEASE_DIR}.tar.gz.sha256"

      - name: Package release (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $RELEASE_DIR = "shruti-${VERSION}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $RELEASE_DIR

          Copy-Item "target/release/${{ matrix.binary }}" "$RELEASE_DIR/"
          Copy-Item "LICENSE" "$RELEASE_DIR/"
          Copy-Item "README.md" "$RELEASE_DIR/"

          Compress-Archive -Path $RELEASE_DIR -DestinationPath "${RELEASE_DIR}.zip"
          $hash = (Get-FileHash "${RELEASE_DIR}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${RELEASE_DIR}.zip" | Out-File -Encoding ascii "${RELEASE_DIR}.zip.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            shruti-*.${{ matrix.archive }}
            shruti-*.${{ matrix.archive }}.sha256
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the CHANGELOG.md section for this version.
          # Matches from "## <version>" up to the next "## " heading or EOF.
          SECTION=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, ver)) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # Fallback to git log if no CHANGELOG section found.
          if [ -z "$SECTION" ]; then
            TAG_COUNT=$(git tag --sort=-version:refname | wc -l)
            if [ "$TAG_COUNT" -ge 2 ]; then
              PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
              SECTION=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
            else
              SECTION=$(git log --oneline --no-decorate)
            fi
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SECTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Collect release stats
        id: stats
        run: |
          TEST_COUNT=$(cargo test --workspace -- --list 2>/dev/null | grep -c ': test$' || echo "?")
          CRATE_COUNT=$(cargo metadata --no-deps --format-version=1 2>/dev/null | python3 -c "import sys,json; print(len(json.load(sys.stdin)['packages']))" 2>/dev/null || echo "?")
          echo "tests=$TEST_COUNT" >> "$GITHUB_OUTPUT"
          echo "crates=$CRATE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Shruti ${{ steps.version.outputs.version }}
          body: |
            <div align="center">

            # Shruti ${{ steps.version.outputs.version }}

            **A Rust-native Digital Audio Workstation**
            *Sample-accurate | Real-time | Cross-platform*

            ![Rust](https://img.shields.io/badge/Rust-2024_edition-orange?logo=rust)
            ![Tests](https://img.shields.io/badge/tests-${{ steps.stats.outputs.tests }}%20passing-brightgreen)
            ![Crates](https://img.shields.io/badge/crates-${{ steps.stats.outputs.crates }}-blue)
            ![License](https://img.shields.io/badge/license-GPL--3.0-purple)

            </div>

            ---

            ## Highlights

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Downloads

            > All binaries are statically linked and require no additional dependencies.

            | | Platform | Architecture | Archive | Checksum |
            |---|----------|-------------|---------|----------|
            | :penguin: | **Linux** | x86_64 | [`shruti-${{ steps.version.outputs.version }}-linux.tar.gz`] | [sha256] |
            | :apple: | **macOS** | arm64 (Apple Silicon) | [`shruti-${{ steps.version.outputs.version }}-macos-arm64.tar.gz`] | [sha256] |
            | :window: | **Windows** | x86_64 | [`shruti-${{ steps.version.outputs.version }}-windows.zip`] | [sha256] |

            ## Quick Start

            <details>
            <summary><b>Linux / macOS</b></summary>

            ```sh
            # Download and extract
            tar xzf shruti-${{ steps.version.outputs.version }}-<platform>.tar.gz
            cd shruti-${{ steps.version.outputs.version }}-<platform>

            # Run the DAW
            ./shruti

            # Or start the headless server for AI agent integration
            ./shruti serve --port 8050
            ```
            </details>

            <details>
            <summary><b>Windows</b></summary>

            Extract the `.zip` and run `shruti.exe`.
            </details>

            <details>
            <summary><b>Verify download integrity</b></summary>

            Each archive has a matching `.sha256` checksum file:
            ```sh
            sha256sum -c shruti-${{ steps.version.outputs.version }}-<platform>.tar.gz.sha256
            ```
            </details>

            ---

            ## Ecosystem

            Shruti is part of the **Sanskrit Stack** for the [AGNOS](https://github.com/MacCracken/agnosticos) AI-native Linux OS:

            | Crate | Role |
            |-------|------|
            | [dhvani](https://crates.io/crates/dhvani) | Core audio engine (DSP, analysis, MIDI, graph) |
            | [tarang](https://crates.io/crates/tarang) | Media framework (codecs, streaming, muxing) |
            | [hoosh](https://crates.io/crates/hoosh) | Music LLM inference gateway |
            | **shruti** | Digital Audio Workstation |
          files: |
            release-artifacts/release-linux/*
            release-artifacts/release-macos-arm64/*
            release-artifacts/release-windows/*
          prerelease: true

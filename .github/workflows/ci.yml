name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --workspace --tests --features tarang -- -W clippy::all -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run security audit
        run: cargo audit

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - shruti-engine
          - shruti-dsp
          - shruti-plugin
          - shruti-ui
          - shruti-session
          - shruti-ai
          - shruti-instruments
          - shruti-test-utils
          - shruti
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Run unit tests for ${{ matrix.package }}
        run: cargo test -p ${{ matrix.package }} --features tarang --lib --bins --benches --examples

  integration:
    name: Integration Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - shruti-instruments
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Run integration tests for ${{ matrix.package }}
        run: cargo test -p ${{ matrix.package }} --features tarang --test '*'

  e2e:
    name: E2E Tests
    needs: [test, integration]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Run end-to-end tests
        run: cargo test -p shruti --features tarang --test integration

  coverage:
    name: Coverage (50% threshold)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --workspace --features tarang --fail-under 50 --exclude-files "vendor/*" "src/main.rs" "src/bin/*" --ignore-tests

  build:
    name: Build Release
    needs: [check, test, integration, e2e, security, coverage]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/maccracken/agnosticos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          ark update
          ark install rust tarang libasound2-dev pkg-config
      - name: Build release binary
        run: cargo build --release --features tarang
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: shruti-linux-amd64
          path: target/release/shruti

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: build
      - name: Build workspace
        run: cargo build --release --workspace

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: quality
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: security
      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - shruti-engine
          - shruti-dsp
          - shruti-plugin
          - shruti-ui
          - shruti-session
          - shruti-ai
          - shruti-instruments
          - shruti-test-utils
          - shruti
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: test
      - name: Run tests
        run: cargo test --package ${{ matrix.package }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: coverage
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run coverage
        run: |
          cargo tarpaulin --workspace \
            --fail-under 50 \
            --timeout 300 \
            --out xml \
            --skip-clean \
            --exclude-files "vendor/*" "src/main.rs"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: ./.github/actions/setup-rust-env
        with:
          cache-prefix: docs
      - name: Check required docs
        run: |
          for f in README.md CHANGELOG.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "Missing required doc: $f"
              exit 1
            fi
          done
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

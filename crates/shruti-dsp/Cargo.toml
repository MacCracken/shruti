[package]
name = "shruti-dsp"
version = "2026.3.21"
edition = "2024"
description = "DSP primitives and effects for Shruti"
license = "GPL-3.0"

[features]
default = []
tarang = ["dep:tarang", "dep:bytes"]
opus-enc = ["tarang", "tarang/opus-enc"]
aac-enc = ["tarang", "tarang/aac-enc"]

[dependencies]
dhvani = { version = "0.21.3", default-features = false, features = ["dsp", "analysis", "simd", "midi", "graph"] }
tarang = { version = "0.20.3", optional = true }
bytes = { workspace = true, optional = true }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

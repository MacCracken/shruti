[package]
name = "shruti-ai"
version = "2026.3.18"
edition = "2024"
description = "AI agent integration for Shruti (AGNOS)"
license = "GPL-3.0"

[features]
default = []
tarang = ["dep:tarang-ai", "dep:tarang-core", "dep:bytes", "dep:uuid"]

[dependencies]
shruti-session = { path = "../shruti-session" }
shruti-engine = { path = "../shruti-engine" }
shruti-dsp = { path = "../shruti-dsp" }
shruti-plugin = { path = "../shruti-plugin" }
tarang-ai = { path = "../../../tarang/crates/tarang-ai", optional = true }
tarang-core = { path = "../../../tarang/crates/tarang-core", optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

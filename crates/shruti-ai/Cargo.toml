[package]
name = "shruti-ai"
version = "2026.3.20"
edition = "2024"
description = "AI agent integration for Shruti (AGNOS)"
license = "GPL-3.0"

[features]
default = []
tarang = ["dep:tarang", "dep:bytes", "dep:uuid"]
hoosh = ["dep:hoosh"]

[dependencies]
shruti-session = { path = "../shruti-session" }
shruti-engine = { path = "../shruti-engine" }
shruti-dsp = { path = "../shruti-dsp" }
shruti-plugin = { path = "../shruti-plugin" }
tarang = { version = "0.20.3", optional = true }
ai-hwaccel = { version = "0.20.3", features = ["async-detect"] }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hoosh = { version = "0.20.3", optional = true }

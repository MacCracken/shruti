[package]
name = "shruti-ml"
version = "2026.3.21"
edition = "2024"
description = "Music LLM runtime, tokenizer, and AI player agents for Shruti"
license = "GPL-3.0"

[features]
default = []
hoosh = ["dep:hoosh", "dep:tokio"]

[dependencies]
shruti-dsp = { path = "../shruti-dsp" }
shruti-session = { path = "../shruti-session" }
shruti-instruments = { path = "../shruti-instruments" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
hoosh = { version = "0.20.4", optional = true }
tokio = { workspace = true, optional = true }
